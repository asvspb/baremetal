# ==============================================================================
# deploy.conf — Конфигурация автоматического развертывания Dual-Boot
# ==============================================================================

# 1. Целевой накопитель ("AUTO" для автоматического выбора основного NVMe/SSD)
TARGET_DISK="AUTO"

# 2. Размеры разделов:
EFI_SIZE_MB=500                  # Системный раздел загрузчика EFI (МБ)
MSR_SIZE_MB=16                   # Microsoft Reserved Partition (МБ)
WINDOWS_SIZE_GB=250              # Системный раздел Windows C: (ГБ)
RECOVERY_SIZE_MB=1000            # Среда восстановления Windows Recovery (МБ)
SHARED_SIZE_GB=100               # Общий раздел D: для обмена файлами Win/Linux (ГБ)
UBUNTU_ROOT_SIZE_GB=150          # Системный раздел Ubuntu Root / (ГБ)
SWAPFILE_SIZE_GB=4               # Размер динамического /swapfile (ГБ)
# Раздел /home займет всё оставшееся свободное пространство (~430-480 ГБ)

# 3. Файловые системы:
SHARED_FSTYPE="exfat"            # exFAT (рекомендуется для обмена Win/Linux) или ntfs
# Разделы Ubuntu (/ и /home) всегда ext4 — стабильная ФС по умолчанию.

# 4. Параметры пользователя и окружения:
USERNAME="asv-spb"               # Имя пользователя для обеих ОС
HOSTNAME="workstation"           # Имя компьютера в сети
WIN_PASSWORD=""                  # Пароль локальной учётной записи Windows (пусто = без пароля)
TIMEZONE="Europe/Moscow"         # Часовой пояс
DEFAULT_LOCALE="ru_RU.UTF-8"     # Язык системы по умолчанию

# 5. Семь золотых правил стабильности:
ENABLE_UTC_TIME=1                # Синхронизация часов через UTC (часы не сбиваются на 3 часа)
DISABLE_FAST_STARTUP=1           # Отключение Fast Startup в Windows (диски не блокируются)
DISABLE_BITLOCKER=1              # Отключение авто-шифрования BitLocker в Windows 11
ENABLE_FSTRIM_TIMER=1            # Еженедельный TRIM для сохранения ресурса и скорости SSD
INSTALL_RESTRICTED_DRIVERS=1     # Автоустановка проприетарных драйверов (Nvidia, Wi-Fi)
PROTECT_GRUB_REMOVABLE=1         # Защита GRUB от перезаписи обновлениями Windows
ENABLE_SHARED_AUTOMOUNT=1        # Автомонтирование раздела D: (SHARED) в обеих системах
